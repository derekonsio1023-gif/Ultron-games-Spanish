<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cargador GTA V - PlayGTA5</title>
    <style>
        /* Estilos (puedes personalizarlos a tu gusto) */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0b0b0b; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
        #loader-container { text-align: center; width: 80%; max-width: 600px; }
        h1 { font-size: 2.5rem; margin-bottom: 1rem; letter-spacing: 2px; text-transform: uppercase; color: #f0c040; }
        #progress-bar { width: 100%; height: 25px; background-color: #333; border-radius: 12px; overflow: hidden; box-shadow: 0 0 10px #000; margin-bottom: 1rem; }
        #progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #f0c040, #ffaa00); transition: width 0.2s ease; border-radius: 12px; }
        #status-text { font-size: 1.1rem; margin-bottom: 0.5rem; }
        #log { font-size: 0.85rem; color: #aaa; height: 80px; overflow-y: auto; text-align: left; border-top: 1px solid #333; padding-top: 0.5rem; }
        #log span { display: block; margin-bottom: 2px; }
        .hidden { display: none; }
        #play-button { margin-top: 1.5rem; padding: 12px 30px; font-size: 1.2rem; background-color: #f0c040; border: none; border-radius: 6px; color: #000; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        #play-button:hover { background-color: #ffaa00; }
    </style>
</head>
<body>
    <div id="loader-container">
        <h1>Cargando Los Santos</h1>
        <div id="progress-bar"><div id="progress-fill"></div></div>
        <div id="status-text">Iniciando...</div>
        <div id="log"></div>
        <button id="play-button" class="hidden" onclick="startGame()">¡Jugar Ahora!</button>
    </div>

    <script>
        // =================================================================
        // CONFIGURACIÓN
        // =================================================================

        // URL base para los recursos del juego (la que confirmaste que está activa).
        const ASSET_BASE_URL = 'https://playgta5.com/data/';

        // Ruta al manifiesto de descarga.
        // Si el archivo 'download-plan.json' está en la misma carpeta que este index.html,
        // puedes usar una ruta relativa. Si está en otro lugar, pon la URL completa.
        const MANIFEST_URL = 'download-plan.json'; // o 'https://playgta5.com/snapshot/download-plan.json'

        // Nombre de la caché donde se guardarán los archivos.
        const CACHE_NAME = 'playgta5-assets-v1';

        // =================================================================
        // ELEMENTOS DEL DOM
        // =================================================================
        const progressFill = document.getElementById('progress-fill');
        const statusText = document.getElementById('status-text');
        const logContainer = document.getElementById('log');
        const playButton = document.getElementById('play-button');

        // =================================================================
        // ESTADO GLOBAL
        // =================================================================
        let totalBytes = 0;
        let downloadedBytes = 0;
        let cache; // Referencia al objeto Cache

        // =================================================================
        // FUNCIONES AUXILIARES
        // =================================================================
        function log(message) {
            const span = document.createElement('span');
            span.textContent = `> ${message}`;
            logContainer.appendChild(span);
            logContainer.scrollTop = logContainer.scrollHeight;
            console.log(message);
        }

        function updateProgress() {
            const percent = totalBytes > 0 ? (downloadedBytes / totalBytes) * 100 : 0;
            progressFill.style.width = `${percent.toFixed(2)}%`;
            statusText.textContent = `Descargando... ${percent.toFixed(1)}% (${(downloadedBytes / 1024 / 1024).toFixed(1)} MB / ${(totalBytes / 1024 / 1024).toFixed(1)} MB)`;
        }

        // =================================================================
        // LÓGICA PRINCIPAL
        // =================================================================

        /**
         * Abre (o crea) la caché del navegador.
         */
        async function openCache() {
            if ('caches' in window) {
                cache = await caches.open(CACHE_NAME);
                log('✅ Cache API abierta correctamente.');
            } else {
                throw new Error('Tu navegador no soporta la Cache API. Se recomienda usar Chrome, Edge o Brave.');
            }
        }

        /**
         * Carga el manifiesto JSON con la lista de archivos.
         * Se asume que el JSON es un array de objetos con al menos la propiedad 'path'.
         * Ejemplo: [{ "path": "x64/models/cdimages/componentpeds_a_m_m.rpf" }, ...]
         */
        async function loadManifest() {
            log('Cargando manifiesto de recursos...');
            try {
                const response = await fetch(MANIFEST_URL);
                if (!response.ok) throw new Error(`HTTP ${response.status} al cargar el manifiesto`);
                const manifest = await response.json();

                // Si el manifiesto tiene una propiedad que contiene el array (ej. 'files'), la usamos.
                const files = manifest.files || manifest;
                if (!Array.isArray(files)) {
                    throw new Error('El formato del manifiesto no es válido. Se esperaba un array de archivos.');
                }

                log(`Manifiesto cargado: ${files.length} archivos encontrados.`);
                return files;
            } catch (error) {
                log(`❌ Error al cargar el manifiesto: ${error.message}`);
                statusText.textContent = 'Error: No se pudo cargar la lista de recursos.';
                throw error;
            }
        }

        /**
         * Descarga un archivo y lo guarda directamente en la caché.
         * Esto evita mantener archivos gigantes en la memoria RAM.
         */
        async function downloadAndCacheFile(fileInfo) {
            const path = fileInfo.path;
            // Si la ruta ya es una URL completa, la usamos; si no, la concatenamos a la base.
            const url = path.startsWith('http') ? path : ASSET_BASE_URL + path;

            // Verificar si el archivo ya está en la caché para no volver a descargarlo.
            const cachedResponse = await cache.match(url);
            if (cachedResponse) {
                const blob = await cachedResponse.blob();
                downloadedBytes += blob.size;
                totalBytes += blob.size; // Ajustamos el total para que el progreso sea preciso.
                updateProgress();
                log(`⏩ ${path} ya estaba en caché (${(blob.size / 1024 / 1024).toFixed(2)} MB).`);
                return;
            }

            log(`Iniciando descarga: ${path}`);
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP ${response.status} para ${path}`);

                const contentLength = response.headers.get('content-length');
                const fileSize = contentLength ? parseInt(contentLength, 10) : (fileInfo.size || 0);
                totalBytes += fileSize;

                // Clonamos la respuesta para poder leerla dos veces: una para el progreso y otra para guardarla.
                const responseClone = response.clone();
                const reader = response.body.getReader();
                let receivedLength = 0;

                // Leemos el stream para actualizar el progreso en tiempo real.
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    receivedLength += value.length;
                    downloadedBytes += value.length;
                    updateProgress();
                }

                // Guardamos la respuesta completa (el clon) en la caché.
                await cache.put(url, responseClone);
                log(`✅ ${path} descargado y guardado en caché (${(receivedLength / 1024 / 1024).toFixed(2)} MB).`);

            } catch (error) {
                log(`❌ Error al descargar ${path}: ${error.message}`);
                // No detenemos todo el proceso si un archivo falla; se reintentará en la próxima carga.
            }
        }

        /**
         * Orquesta la descarga secuencial de todos los archivos del manifiesto.
         */
        async function startDownload() {
            try {
                await openCache();
                const manifest = await loadManifest();

                // Reiniciar contadores
                totalBytes = 0;
                downloadedBytes = 0;
                updateProgress();

                log('Comenzando la descarga de recursos del juego...');
                // Descarga secuencial para no saturar la red ni el disco.
                for (const file of manifest) {
                    await downloadAndCacheFile(file);
                }

                log('🎉 Todos los recursos han sido procesados.');
                statusText.textContent = 'Listo para jugar.';
                progressFill.style.width = '100%';
                playButton.classList.remove('hidden');

            } catch (error) {
                log('La carga falló. Revisa los mensajes anteriores para más detalles.');
            }
        }

        // =================================================================
        // INICIO DEL JUEGO (SIMULADO)
        // =================================================================
        function startGame() {
            log('Iniciando el motor WebAssembly de PlayGTA5...');

            // Aquí es donde integrarías el motor real.
            // El motor original (game.wasm, game.js, workers) se cargaría desde la caché.
            // Ejemplo:
            // const wasmResponse = await cache.match('https://playgta5.com/data/game.wasm');
            // const wasmBlob = await wasmResponse.blob();
            // const wasmUrl = URL.createObjectURL(wasmBlob);
            // ... y luego inicializarías el runtime con esa URL.

            setTimeout(() => {
                alert('El motor de PlayGTA5 se iniciaría aquí. Revisa la consola para ver los archivos en caché.');
                // Para verificar que los archivos están en caché, puedes ejecutar:
                // caches.open(CACHE_NAME).then(c => c.keys().then(keys => console.log('Archivos en caché:', keys)));
            }, 500);
        }

        // =================================================================
        // ARRANQUE
        // =================================================================
        window.addEventListener('DOMContentLoaded', () => {
            startDownload();
        });
    </script>
</body>
</html>
