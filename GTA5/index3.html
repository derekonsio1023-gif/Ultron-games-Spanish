<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cargador GTA V - PlayGTA5</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0b0b0b; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
        #loader-container { text-align: center; width: 80%; max-width: 600px; }
        h1 { font-size: 2.5rem; margin-bottom: 1rem; letter-spacing: 2px; text-transform: uppercase; color: #f0c040; }
        #progress-bar { width: 100%; height: 25px; background-color: #333; border-radius: 12px; overflow: hidden; box-shadow: 0 0 10px #000; margin-bottom: 1rem; }
        #progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #f0c040, #ffaa00); transition: width 0.2s ease; border-radius: 12px; }
        #status-text { font-size: 1.1rem; margin-bottom: 0.5rem; }
        #log { font-size: 0.85rem; color: #aaa; height: 140px; overflow-y: auto; text-align: left; border-top: 1px solid #333; padding-top: 0.5rem; }
        #log span { display: block; margin-bottom: 2px; word-break: break-all; }
        .hidden { display: none; }
        #play-button { margin-top: 1.5rem; padding: 12px 30px; font-size: 1.2rem; background-color: #f0c040; border: none; border-radius: 6px; color: #000; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        #play-button:hover { background-color: #ffaa00; }
        .debug { color: #ffcc00; font-family: monospace; font-size: 0.75rem; }
    </style>
</head>
<body>
    <div id="loader-container">
        <h1>Cargando Los Santos</h1>
        <div id="progress-bar"><div id="progress-fill"></div></div>
        <div id="status-text">Iniciando...</div>
        <div id="log"></div>
        <button id="play-button" class="hidden" onclick="startGame()">¡Jugar Ahora!</button>
    </div>

    <script>
        // =================================================================
        // CONFIGURACIÓN
        // =================================================================

        // Ruta al manifiesto (relativa a este index2.html)
        const MANIFEST_URL = 'download-plan.json';

        const CACHE_NAME = 'playgta5-assets-v1';

        // ⚠️ CORS: 'raw.githack.com' no puede hacer fetch directo a 'playgta5.com'
        // porque el servidor no envía 'Access-Control-Allow-Origin'.
        //
        // Opciones:
        //   - false  -> intenta fetch directo (fallará con CORS si no estás en el mismo origen)
        //   - true   -> usa un proxy CORS para todas las peticiones
        //
        // Con proxy, los archivos grandes (>10-20 MB) pueden fallar en algunos proxies.
        const USE_CORS_PROXY = true;
        const CORS_PROXY_URL = 'https://api.allorigins.win/raw?url='; // o 'https://corsproxy.io/?url='

        // =================================================================
        // DOM
        // =================================================================
        const progressFill = document.getElementById('progress-fill');
        const statusText = document.getElementById('status-text');
        const logContainer = document.getElementById('log');
        const playButton = document.getElementById('play-button');

        let totalBytes = 0;
        let downloadedBytes = 0;
        let cache;
        let manifestConfig = null; // Guardamos el objeto completo (origin, build, version, tasks...)

        // =================================================================
        // UTILIDADES
        // =================================================================
        function log(message, debug = false) {
            const span = document.createElement('span');
            if (debug) span.className = 'debug';
            span.textContent = `> ${message}`;
            logContainer.appendChild(span);
            logContainer.scrollTop = logContainer.scrollHeight;
            console.log(message);
        }

        function updateProgress() {
            const percent = totalBytes > 0 ? (downloadedBytes / totalBytes) * 100 : 0;
            progressFill.style.width = `${percent.toFixed(2)}%`;
            statusText.textContent = `Descargando... ${percent.toFixed(1)}% (${(downloadedBytes / 1024 / 1024).toFixed(1)} MB / ${(totalBytes / 1024 / 1024).toFixed(1)} MB)`;
        }

        /**
         * Devuelve la URL final (con o sin proxy CORS) para descargar un recurso.
         */
        function buildFetchUrl(targetUrl) {
            if (USE_CORS_PROXY) {
                return CORS_PROXY_URL + encodeURIComponent(targetUrl);
            }
            return targetUrl;
        }

        // =================================================================
        // CACHE API
        // =================================================================
        async function openCache() {
            if (!('caches' in window)) {
                throw new Error('Tu navegador no soporta la Cache API. Usa Chrome, Edge o Brave.');
            }
            cache = await caches.open(CACHE_NAME);
            log('✅ Cache API abierta correctamente.');
        }

        // =================================================================
        // CARGA DEL MANIFIESTO
        // =================================================================
        async function loadManifest() {
            log('Cargando manifiesto de recursos...');

            // El manifiesto está en GitHub, sí podemos leerlo sin CORS.
            const response = await fetch(MANIFEST_URL, { cache: 'no-store' });
            if (!response.ok) {
                throw new Error(`HTTP ${response.status} al cargar el manifiesto`);
            }
            const raw = await response.json();

            if (!raw || typeof raw !== 'object' || !Array.isArray(raw.tasks)) {
                throw new Error('El manifiesto no contiene la propiedad "tasks" (array de tareas).');
            }

            manifestConfig = raw;
            log(`✅ Manifiesto válido.`);
            log(`  origin: ${raw.origin}`, true);
            log(`  build: ${raw.build}`, true);
            log(`  version: ${raw.version}`, true);
            log(`  workers: ${raw.workers}`, true);
            log(`  tareas: ${raw.tasks.length}`, true);

            // Convertimos cada tarea [path, size, hash] al formato interno { path, size, hash }
            const files = raw.tasks.map(task => {
                if (!Array.isArray(task) || task.length < 1) {
                    throw new Error(`Tarea con formato inesperado: ${JSON.stringify(task)}`);
                }
                return {
                    path: task[0],
                    size: Number(task[1]) || 0,
                    hash: task[2] || ''
                };
            });

            log(`✅ ${files.length} archivos listos para descargar.`);
            return files;
        }

        // =================================================================
        // DESCARGA
        // =================================================================
        async function downloadAndCacheFile(fileInfo) {
            // URL final: origin + path (ej. https://playgta5.com + /b/8b0b5899ed/game.wasm)
            const targetUrl = manifestConfig.origin + fileInfo.path;

            // Comprobamos si ya está en caché
            const cachedResponse = await cache.match(targetUrl);
            if (cachedResponse) {
                const blob = await cachedResponse.blob();
                totalBytes += blob.size;
                downloadedBytes += blob.size;
                updateProgress();
                log(`⏩ (caché) ${fileInfo.path}`);
                return;
            }

            log(`⬇️ ${fileInfo.path} (${(fileInfo.size / 1024 / 1024).toFixed(2)} MB)`);

            try {
                const fetchUrl = buildFetchUrl(targetUrl);
                const response = await fetch(fetchUrl);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const contentLength = response.headers.get('content-length');
                const fileSize = contentLength ? parseInt(contentLength, 10) : fileInfo.size;
                totalBytes += fileSize;

                const responseClone = response.clone();
                const reader = response.body.getReader();
                let receivedLength = 0;

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    receivedLength += value.length;
                    downloadedBytes += value.length;
                    updateProgress();
                }

                // Guardamos en caché bajo la URL ORIGINAL (no la del proxy)
                // para que el motor pueda recuperarlo después sin proxy.
                await cache.put(targetUrl, responseClone);
                log(`✅ ${fileInfo.path} (${(receivedLength / 1024 / 1024).toFixed(2)} MB)`);

            } catch (error) {
                log(`❌ ${fileInfo.path}: ${error.message}`);
            }
        }

        async function startDownload() {
            try {
                await openCache();
                const files = await loadManifest();

                totalBytes = 0;
                downloadedBytes = 0;
                updateProgress();

                log('Comenzando descarga de recursos...');
                for (const file of files) {
                    await downloadAndCacheFile(file);
                }

                log('🎉 Todos los recursos procesados.');
                statusText.textContent = 'Listo para jugar.';
                progressFill.style.width = '100%';
                playButton.classList.remove('hidden');
            } catch (error) {
                log(`❌ Fallo general: ${error.message}`);
                statusText.textContent = `Error: ${error.message}`;
            }
        }

        // =================================================================
        // INICIO DEL JUEGO
        // =================================================================
        async function startGame() {
            log('Preparando motor WebAssembly...');

            // Recuperar game.wasm y game.js de la caché
            const wasmPath = manifestConfig.build + '/game.wasm';
            const wasmUrl = manifestConfig.origin + wasmPath;
            const cachedWasm = await cache.match(wasmUrl);

            if (!cachedWasm) {
                alert('No se encontró game.wasm en caché. Revisa los errores de descarga.');
                return;
            }

            // Crear Blob URL para el wasm
            const wasmBlob = await cachedWasm.blob();
            const wasmBlobUrl = URL.createObjectURL(wasmBlob);
            log(`✅ game.wasm listo: ${wasmBlobUrl}`, true);

            // ⚠️ AQUÍ necesitas el bootstrap real del cliente de playgta5.
            // Descargar game.js + workers + audio-worklet.js y ejecutarlos en orden.
            // El cliente original está en https://playgta5.com/ (probablemente index.html + scripts).
            //
            // Una opción avanzada: descargar el HTML/JS originales de playgta5.com,
            // sustituir sus URLs por las tuyas, y ejecutarlos desde un iframe/blob.

            alert('Recursos descargados en caché. Aquí debes integrar el bootstrap real de playgta5.\n\nRevisa la consola para ver la lista de archivos en caché.');
            caches.open(CACHE_NAME).then(c => c.keys().then(keys => {
                console.log('Archivos en caché:', keys.map(k => k.url));
            }));
        }

        window.addEventListener('DOMContentLoaded', startDownload);
    </script>
</body>
</html>
