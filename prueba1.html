<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ultron Launcher</title>

<style>
  html,body {
    margin:0;
    padding:0;
    background:#080b14;
    color:#e6edf3;
    font-family:system-ui,Segoe UI,sans-serif;
  }

  #launcher {
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    user-select:none;
  }

  #launcher .inner {
    padding:32px;
    max-width:520px;
    width:100%;
    text-align:center;
  }

  #launcher h1 {
    margin:0 0 8px;
    font-size:22px;
  }

  #launcher p {
    margin:0;
    color:#8b949e;
    font-size:14px;
  }

  #launcher .hint {
    margin-top:16px;
    font-size:12px;
  }
</style>
</head>

<body>

<div id="launcher">
  <div class="inner">
    <h1>Ultron Launcher</h1>
    <p id="status">Comprobando versión…</p>
    <p class="hint">Haz click en cualquier parte para lanzar</p>
  </div>
</div>

<script>
(() => {
  "use strict";

  // CONFIGURACIÓN
  const OWNER = "derekonsio1023-gif";
  const REPO = "Ultron-games-Spanish";
  const BRANCH = "main";

  const FILE_RE = /^UltronALPHA\d+(?:\.\d+)*\.html$/i;

  const FALLBACK = {
    sha: BRANCH,
    file: "UltronALPHA8.2.html"
  };

  const LS = "ultron:latest";

  // ELEMENTOS
  const launcherEl = document.getElementById("launcher");
  const statusEl = document.getElementById("status");

  // CACHÉ LOCAL
  const readCache = () => {
    try {
      return JSON.parse(localStorage.getItem(LS) || "null");
    } catch {
      return null;
    }
  };

  const writeCache = value => {
    try {
      localStorage.setItem(LS, JSON.stringify(value));
    } catch {}
  };

  // API DE GITHUB
  const gh = path => fetch(
    `https://api.github.com/repos/${OWNER}/${REPO}${path}`,
    {
      cache: "no-store",
      headers: {
        Accept: "application/vnd.github+json"
      }
    }
  );

  // DETECTAR ÚLTIMA VERSIÓN
  async function resolverRemoto() {

    const r1 = await gh(`/commits/${BRANCH}`);

    if (r1.status === 403 || r1.status === 429) {
      throw new Error("Límite de la API de GitHub");
    }

    if (!r1.ok) {
      throw new Error("GitHub " + r1.status);
    }

    const { sha } = await r1.json();

    // Comprobar caché
    const cached = readCache();

    if (cached && cached.sha === sha && cached.file) {
      return cached;
    }

    // Obtener archivos del repositorio
    const r2 = await gh(`/contents/?ref=${sha}`);

    if (!r2.ok) {
      throw new Error("Contents " + r2.status);
    }

    const items = await r2.json();

    // Filtrar versiones de Ultron
    const files = items
      .filter(it =>
        it.type === "file" &&
        FILE_RE.test(it.name)
      )
      .map(it => it.name)
      .sort((a, b) =>
        a.localeCompare(
          b,
          undefined,
          { numeric:true }
        )
      );

    if (!files.length) {
      throw new Error("No hay versiones UltronALPHA");
    }

    const latest = {
      sha,
      file: files[files.length - 1]
    };

    writeCache(latest);

    return latest;
  }

  // CDN CON SHA EXACTO DEL COMMIT
  const gameUrl = ({ sha, file }) =>
    `https://rawcdn.githack.com/${OWNER}/${REPO}/${sha}/${file}`;

  // ESTADO
  let actual = null;
  let lanzado = false;

  // COMPROBACIÓN INICIAL
  let resolviendo = resolverRemoto()
    .then(version => {

      actual = version;

      statusEl.textContent =
        "Versión lista: " + version.file;

      return version;

    })
    .catch(error => {

      actual = FALLBACK;

      statusEl.textContent =
        "No se pudo comprobar la versión (" +
        error.message +
        "). Se usará " +
        FALLBACK.file;

      return FALLBACK;
    });

  // LANZADOR
  launcherEl.addEventListener("click", async () => {

    if (lanzado) return;

    lanzado = true;

    // IMPORTANTE:
    // Abrir about:blank directamente durante el clic
    // para evitar que Chrome bloquee la ventana.
    const nuevaPestana = window.open(
      "about:blank",
      "_blank"
    );

    if (!nuevaPestana) {

      lanzado = false;

      statusEl.textContent =
        "Ventana bloqueada. Permite las ventanas emergentes.";

      return;
    }

    try {

      // Página temporal de carga
      nuevaPestana.document.open();

      nuevaPestana.document.write(`
        <!DOCTYPE html>
        <html lang="es">
        <head>
          <meta charset="UTF-8">
          <meta name="viewport"
                content="width=device-width,initial-scale=1">

          <title>Ultron - Cargando...</title>

          <style>
            html,body {
              margin:0;
              width:100%;
              height:100%;
              background:#080b14;
              color:#e6edf3;
              font-family:system-ui,sans-serif;
              display:flex;
              align-items:center;
              justify-content:center;
            }
          </style>
        </head>

        <body>
          <p>Comprobando versión de Ultron...</p>
        </body>
        </html>
      `);

      nuevaPestana.document.close();

      // Esperar a GitHub
      const info = await resolviendo;

      if (nuevaPestana.closed) return;

      // CARGAR CDN EN EL NUEVO ABOUT:BLANK
      nuevaPestana.location.replace(
        gameUrl(info)
      );

      statusEl.textContent =
        "Ultron iniciado: " + info.file;

    } catch (error) {

      if (!nuevaPestana.closed) {
        nuevaPestana.document.body.textContent =
          "Error al cargar Ultron: " + error.message;
      }

      lanzado = false;
    }
  });

  // DETECTAR NUEVAS VERSIONES AL VOLVER
  document.addEventListener(
    "visibilitychange",
    async () => {

      if (
        document.visibilityState !== "visible" ||
        lanzado
      ) return;

      try {

        const remoto = await resolverRemoto();

        if (!actual || remoto.sha !== actual.sha) {

          actual = remoto;

          resolviendo = Promise.resolve(remoto);

          statusEl.textContent =
            "Nueva versión detectada: " +
            remoto.file;
        }

      } catch {}
    }
  );

})();
</script>

</body>
</html>
