<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ultron Launcher</title>
<style>
  html,body{margin:0;padding:0;background:#080b14;color:#e6edf3;font-family:system-ui,Segoe UI,sans-serif;}
  #launcher{min-height:100vh;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;}
  #launcher .inner{padding:32px;max-width:520px;width:100%;text-align:center;}
  #launcher h1{margin:0 0 8px;font-size:22px;}
  #launcher p{margin:0;color:#8b949e;font-size:14px;}
  #launcher .hint{margin-top:16px;font-size:12px;}

  #gameScreen{display:none;flex-direction:column;height:100vh;height:100dvh;}
  #gameBar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#111;color:#fff;flex-shrink:0;font-size:13px;}
  #gameBack{padding:6px 14px;cursor:pointer;border:1px solid #444;background:#222;color:#fff;border-radius:6px;font:inherit;}
  #gameBack:hover{background:#2d2d2d;}
  #gameTitle{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#8b949e;font-size:12px;}
  #gameFrame{flex:1;border:0;width:100%;background:#fff;display:none;}
  #gameLoading{flex:1;display:flex;align-items:center;justify-content:center;color:#8b949e;font-size:14px;}
</style>
</head>
<body>

<div id="launcher">
  <div class="inner">
    <h1>Ultron Launcher</h1>
    <p id="status">Comprobando versión…</p>
    <p class="hint">Haz click en cualquier parte para lanzar</p>
  </div>
</div>

<div id="gameScreen">
  <div id="gameBar">
    <button id="gameBack" type="button">← Volver</button>
    <span id="gameTitle">Cargando…</span>
  </div>
  <div id="gameLoading">Cargando juego…</div>
  <iframe id="gameFrame"
          src="about:blank"
          allow="fullscreen; autoplay; clipboard-write; gamepad; microphone; camera; encrypted-media"
          referrerpolicy="no-referrer-when-downgrade"></iframe>
</div>

<script>
(() => {
  "use strict";

  const OWNER  = "derekonsio1023-gif";
  const REPO   = "Ultron-games-Spanish";     // ← repo correcto
  const BRANCH = "main";
  const FILE_RE = /^UltronALPHA\d+(?:\.\d+)*\.html$/i;
  const FALLBACK = { sha: BRANCH, file: "UltronALPHA8.2.html" };
  const LS = "ultron:latest";

  const launcherEl  = document.getElementById("launcher");
  const gameScreen  = document.getElementById("gameScreen");
  const gameFrame   = document.getElementById("gameFrame");
  const gameBack    = document.getElementById("gameBack");
  const gameTitle   = document.getElementById("gameTitle");
  const gameLoading = document.getElementById("gameLoading");
  const statusEl    = document.getElementById("status");

  const readCache  = () => { try { return JSON.parse(localStorage.getItem(LS) || "null"); } catch { return null; } };
  const writeCache = v  => { try { localStorage.setItem(LS, JSON.stringify(v)); } catch {} };

  const gh = path => fetch(`https://api.github.com/repos/${OWNER}/${REPO}${path}`, {
    cache: "no-store",
    headers: { Accept: "application/vnd.github+json" }
  });

  async function resolverRemoto() {
    const r1 = await gh(`/commits/${BRANCH}`);
    if (r1.status === 403 || r1.status === 429) throw new Error("límite de la API de GitHub");
    if (!r1.ok) throw new Error("GitHub " + r1.status);
    const { sha } = await r1.json();

    const cached = readCache();
    if (cached && cached.sha === sha && cached.file) return cached;

    const r2 = await gh(`/contents/?ref=${sha}`);
    if (!r2.ok) throw new Error("contents " + r2.status);
    const items = await r2.json();
    const files = items
      .filter(it => it.type === "file" && FILE_RE.test(it.name))
      .map(it => it.name)
      .sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
    if (!files.length) throw new Error("no hay UltronALPHA*.html en el repo");

    const latest = { sha, file: files[files.length - 1] };
    writeCache(latest);
    return latest;
  }

  // Githack con SHA → fuerza carga fresca cuando hay commit nuevo.
  // Si tu githack no acepta SHA, cambia a:
  //   `https://rawcdn.githack.com/${OWNER}/${REPO}/refs/heads/${BRANCH}/${file}`
  const gameUrl = ({ sha, file }) =>
    `https://rawcdn.githack.com/${OWNER}/${REPO}/${sha}/${file}`;

  let actual = null;
  let resolviendo = resolverRemoto()
    .then(v => {
      actual = v;
      statusEl.textContent = "Versión lista: " + v.file;
      return v;
    })
    .catch(e => {
      actual = FALLBACK;
      statusEl.textContent = "No se pudo comprobar la versión (" + e.message + "). Se usará " + FALLBACK.file + ".";
      return FALLBACK;
    });

  let lanzado = false;

  function showLoading(text) {
    gameLoading.textContent = text;
    gameLoading.style.display = "flex";
    gameFrame.style.display = "none";
  }

  function showFrame() {
    gameLoading.style.display = "none";
    gameFrame.style.display = "block";
  }

  function setFrameUrl(url) {
    return new Promise((resolve, reject) => {
      const onLoad = () => {
        gameFrame.removeEventListener("load", onLoad);
        gameFrame.removeEventListener("error", onError);
        resolve();
      };
      const onError = () => {
        gameFrame.removeEventListener("load", onLoad);
        gameFrame.removeEventListener("error", onError);
        reject(new Error("No se pudo cargar el juego"));
      };
      gameFrame.addEventListener("load", onLoad);
      gameFrame.addEventListener("error", onError);
      gameFrame.src = url;
    });
  }

  launcherEl.addEventListener("click", async () => {
    if (lanzado) return;
    lanzado = true;

    launcherEl.style.display = "none";
    gameScreen.style.display = "flex";
    showLoading("Comprobando versión…");
    gameTitle.textContent = "Cargando…";

    try {
      const info = await resolviendo;
      gameTitle.textContent = info.file;
      showLoading("Cargando " + info.file + "…");

      await setFrameUrl(gameUrl(info));
      showFrame();
    } catch (e) {
      gameLoading.textContent = "Error: " + e.message;
      statusEl.textContent = "Error: " + e.message;
      lanzado = false;
    }
  });

  function volver() {
    // Destruye el contexto del juego (WebGL, audio, timers)
    gameFrame.src = "about:blank";
    gameFrame.style.display = "none";
    gameScreen.style.display = "none";
    launcherEl.style.display = "flex";
    gameTitle.textContent = "Cargando…";
    lanzado = false;
  }

  gameBack.addEventListener("click", volver);

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && gameScreen.style.display === "flex") volver();
  });

  // Re-comprobar al volver a la pestaña, mientras no se haya lanzado nada
  document.addEventListener("visibilitychange", async () => {
    if (document.visibilityState !== "visible" || lanzado) return;
    try {
      const remoto = await resolverRemoto();
      if (!actual || remoto.sha !== actual.sha) {
        actual = remoto;
        resolviendo = Promise.resolve(remoto);
        statusEl.textContent = "Nueva versión detectada: " + remoto.file;
      }
    } catch {}
  });
})();
</script>
</body>
</html>
