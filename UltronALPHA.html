<!DOCTYPE html>
<html lang="es" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ULTRON AI</title>
    <link rel="icon" href="https://raw.githack.com/derekonsio1023-gif/Ultron-games/main/assets/logo.png?v=1">
    <meta name="theme-color" content="#00ffff">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { 
            --bg-color: #050508; 
            --card-bg: #0d0f16; 
            --border-color: #16192b; 
            --neon-blue: #00d2ff; 
            --neon-pink: #ff0055; 
        }

        * { box-sizing: border-box; }

        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: var(--bg-color); 
            font-family: 'Segoe UI', sans-serif; color: white; 
            overflow-x: hidden; 
        }

        /* ── BOTÓN DE CATEGORÍAS ARRIBA IZQUIERDA ── */
        #menu-toggle {
            position: fixed; top: 20px; left: 20px; z-index: 500;
            width: 64px; height: 64px; border-radius: 16px;
            background: linear-gradient(135deg, rgba(0,210,255,0.15), rgba(255,0,85,0.12));
            border: 2px solid rgba(0,210,255,0.45);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; user-select: none;
            transition: all 0.25s ease;
            box-shadow: 0 0 22px rgba(0,210,255,0.25), inset 0 0 18px rgba(0,210,255,0.08);
        }
        #menu-toggle:hover {
            border-color: var(--neon-blue);
            box-shadow: 0 0 32px rgba(0,210,255,0.55), inset 0 0 22px rgba(0,210,255,0.15);
            transform: translateY(-2px);
        }
        #menu-toggle img {
            width: 42px; height: 42px; object-fit: contain;
            filter: drop-shadow(0 0 10px rgba(0,210,255,0.7));
        }

        /* ── PANEL LATERAL DE CATEGORÍAS ── */
        #side-panel {
            position: fixed; top: 0; left: 0; height: 100vh;
            width: 320px; max-width: 85vw;
            background: linear-gradient(180deg, rgba(8,10,18,0.98), rgba(5,8,14,0.98));
            border-right: 2px solid rgba(0,210,255,0.35);
            box-shadow: 8px 0 40px rgba(0,210,255,0.18);
            z-index: 600; padding: 90px 18px 30px;
            overflow-y: auto;
            transform: translateX(-105%);
            transition: transform 0.35s cubic-bezier(0.22,1,0.36,1);
            backdrop-filter: blur(14px);
        }
        #side-panel.open { transform: translateX(0); }
        #side-panel::-webkit-scrollbar { width: 6px; }
        #side-panel::-webkit-scrollbar-thumb { background: rgba(0,210,255,0.4); border-radius: 3px; }

        .side-panel-title {
            font-size: 0.75rem; letter-spacing: 3px; text-transform: uppercase;
            color: rgba(0,210,255,0.7); font-weight: 900;
            margin: 0 0 16px 8px;
        }

        .cat-btn {
            display: flex; align-items: center; gap: 14px;
            width: 100%; text-align: left;
            background: transparent;
            border: 1px solid rgba(0,210,255,0.14);
            border-radius: 14px; padding: 12px 14px;
            cursor: pointer; user-select: none;
            transition: all 0.2s ease;
            color: #e8faff; font-weight: 800; font-size: 0.82rem;
            letter-spacing: 0.4px; text-transform: uppercase;
            margin-bottom: 8px;
        }
        .cat-btn:hover {
            border-color: var(--neon-blue);
            background: rgba(0,210,255,0.08);
            transform: translateX(4px);
            box-shadow: 0 0 16px rgba(0,210,255,0.2);
        }
        .cat-btn.active {
            border-color: var(--neon-blue);
            background: linear-gradient(90deg, rgba(0,210,255,0.22), rgba(255,0,85,0.12));
            box-shadow: 0 0 22px rgba(0,210,255,0.4);
        }
        .cat-icon {
            width: 30px; height: 30px; object-fit: contain;
            flex-shrink: 0;
            filter: drop-shadow(0 0 8px rgba(0,210,255,0.55));
        }
        .cat-label { flex: 1; }

        /* ── OVERLAY ── */
        #panel-overlay {
            position: fixed; inset: 0; z-index: 550;
            background: rgba(0,0,0,0.45);
            opacity: 0; pointer-events: none;
            transition: opacity 0.3s ease;
            backdrop-filter: blur(2px);
        }
        #panel-overlay.active { opacity: 1; pointer-events: auto; }

        /* ── HEADER Y TÍTULO CENTRADO ── */
        header.hero-header {
            text-align: center;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }
        h1 {
            margin: 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }
        .logo-ultron {
            display: block;
            margin: 0 auto;
            width: 350px;
            max-width: 85vw;
            height: auto;
            filter: drop-shadow(0 0 25px rgba(0, 210, 255, 0.5));
        }

        .main-container { max-width: 1600px; margin: 0 auto; padding: 20px; position: relative; z-index: 2; }
        .section-title { 
            font-size: 1.4rem; color: #fff; border-left: 5px solid var(--neon-pink); 
            padding-left: 15px; margin: 40px 0 20px 0; text-transform: uppercase; 
        }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); 
            gap: 25px; 
        }

        .card { 
            background: var(--card-bg); border-radius: 12px; overflow: hidden; 
            border: 2px solid var(--border-color); display: flex; 
            flex-direction: column; cursor: pointer; 
            transition: all 0.3s ease; aspect-ratio: 2/3; 
            position: relative;
        }
        .card:hover { 
            transform: translateY(-10px); border-color: var(--neon-blue); 
            box-shadow: 0 10px 30px rgba(0, 210, 255, 0.3); 
        }
        .card-thumb { 
            width: 100%; height: 75%; 
            background-size: cover; background-position: center; 
            background-color: #0a0c12; display: flex; 
            align-items: center; justify-content: center; 
            border-bottom: 2px solid var(--border-color);
            position: relative;
        }
        .empty-icon { font-size: 5rem; font-weight: 900; color: #1f243a; user-select: none; }
        .card-footer { 
            height: 25%; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; padding: 5px 10px;
            background: linear-gradient(to bottom, #0d0f16, #050508);
        }
        .card-title { 
            font-size: 0.9rem; font-weight: 800; text-align: center; 
            text-transform: uppercase; color: #fff; width: 100%; 
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; 
        }
        .card-meta {
            display: flex; align-items: center; justify-content: center;
            gap: 8px; margin-top: 4px; flex-wrap: wrap;
        }
        .card-popularity {
            font-size: 0.64rem; color: #7df9ff; font-weight: 800;
            padding: 3px 8px; border-radius: 999px;
            background: rgba(0, 210, 255, 0.12);
            border: 1px solid rgba(0, 210, 255, 0.22);
            white-space: nowrap;
        }
        .card.hidden { display: none !important; }

        /* ── BUSCADOR MINIMALISTA ── */
        .search-wrapper {
            position: sticky; top: 14px; z-index: 50;
            margin: 0 auto 24px auto; max-width: 620px;
        }
        .search-bar {
            display: flex; align-items: center; gap: 10px;
            background: rgba(5, 8, 16, 0.88);
            border: 1px solid rgba(0, 210, 255, 0.28);
            border-radius: 999px; padding: 10px 22px;
            backdrop-filter: blur(12px);
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .search-bar:focus-within {
            border-color: rgba(0,210,255,0.75);
            box-shadow: 0 0 22px rgba(0,210,255,0.3);
        }
        .search-icon { font-size: 1rem; color: var(--neon-blue); flex: 0 0 auto; user-select: none; }
        #search-input { width: 100%; border: none; outline: none; background: transparent; color: white; font-size: 0.95rem; font-weight: 600; letter-spacing: 0.3px; }
        #search-input::placeholder { color: rgba(255,255,255,0.35); font-weight: 500; }

        /* ── ORDENAR ── */
        .sort-wrap {
            display: flex; justify-content: flex-end; align-items: center;
            gap: 10px; margin-bottom: 20px;
            max-width: 1600px; margin-left: auto; margin-right: auto;
        }
        .sort-wrap span {
            font-size: 0.72rem; color: rgba(255,255,255,0.5);
            font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase;
        }
        .sort-select {
            border: 1px solid rgba(0, 210, 255, 0.28);
            background: rgba(10, 12, 22, 0.95);
            color: white; border-radius: 12px;
            padding: 10px 12px; font-weight: 700;
            outline: none; cursor: pointer;
        }

        /* ── PAGINACIÓN ── */
        .pagination {
            display: flex; align-items: center; justify-content: center;
            gap: 10px; margin: 40px 0 20px; flex-wrap: wrap;
        }
        .page-btn {
            border: 1px solid rgba(0,210,255,0.3);
            background: rgba(10,12,22,0.9);
            color: #fff; font-weight: 800; font-size: 0.85rem;
            padding: 10px 16px; border-radius: 12px; cursor: pointer;
            transition: all 0.2s ease; min-width: 42px;
        }
        .page-btn:hover:not(:disabled) {
            border-color: var(--neon-blue);
            box-shadow: 0 0 18px rgba(0,210,255,0.3);
            transform: translateY(-1px);
        }
        .page-btn.active {
            background: linear-gradient(90deg, var(--neon-blue), #0066aa);
            border-color: var(--neon-blue);
            box-shadow: 0 0 20px rgba(0,210,255,0.5);
        }
        .page-btn:disabled { opacity: 0.35; cursor: not-allowed; }
        .page-info {
            color: rgba(255,255,255,0.6); font-size: 0.8rem;
            font-weight: 700; letter-spacing: 1px; margin: 0 8px;
        }

        /* ── SUGERENCIAS (estilo original neón rosa/morado) ── */
        .suggestions-box {
            margin: 40px 0 20px; position: relative;
            border-radius: 28px; padding: 4px;
            background: linear-gradient(120deg, rgba(0,210,255,0.78), rgba(255,0,85,0.68), rgba(0,210,255,0.82));
            background-size: 220% 220%;
            animation: panel-border-flow 9s ease-in-out infinite;
            box-shadow: 0 0 24px rgba(0,210,255,0.16), 0 0 42px rgba(255,0,85,0.11), inset 0 0 24px rgba(255,255,255,0.04);
            overflow: hidden;
        }
        .suggestions-box::before {
            content: ""; position: absolute; inset: 1px; border-radius: 26px;
            background: radial-gradient(circle at 16% 18%, rgba(0,210,255,0.18), transparent 30%),
                        radial-gradient(circle at 82% 28%, rgba(255,0,85,0.18), transparent 26%),
                        linear-gradient(135deg, rgba(10,12,22,0.98), rgba(6,8,14,0.98));
            z-index: 0;
        }
        .suggestions-box::after {
            content: ""; position: absolute; inset: -60% -10%;
            background: linear-gradient(120deg, transparent 35%, rgba(255,255,255,0.12) 50%, transparent 65%);
            transform: translateX(-42%);
            animation: panel-sweep 6.4s linear infinite;
            pointer-events: none; z-index: 1;
        }
        .suggestions-header {
            position: relative; z-index: 2; display: flex; align-items: center; gap: 10px;
            padding: 15px 20px; border-bottom: 1px solid rgba(255,0,85,0.12);
            background: rgba(255,0,85,0.06);
        }
        .suggestions-header-icon { font-size: 1.2rem; filter: drop-shadow(0 0 10px rgba(255,0,85,0.35)); }
        .suggestions-header-title {
            font-size: 0.86rem; font-weight: 900; text-transform: uppercase;
            letter-spacing: 2px; flex: 1; color: #ff8fb2;
            text-shadow: 0 0 10px rgba(255,0,85,0.5);
        }
        .suggestions-body {
            position: relative; z-index: 2; padding: 18px 20px 20px;
            display: flex; flex-direction: column; gap: 12px;
        }
        .suggestions-desc { font-size: 0.84rem; color: rgba(255,255,255,0.58); line-height: 1.5; }
        .suggestions-form { display: flex; gap: 12px; flex-wrap: wrap; }
        .suggestions-input {
            flex: 1; min-width: 200px;
            background: rgba(5,8,16,0.92);
            border: 1px solid rgba(255,0,85,0.26);
            border-radius: 14px; padding: 12px 16px;
            color: #fff; font-size: 0.9rem; font-weight: 600;
            outline: none; transition: border-color 0.2s, box-shadow 0.2s;
        }
        .suggestions-input:focus {
            border-color: rgba(255,0,85,0.62);
            box-shadow: 0 0 0 3px rgba(255,0,85,0.12);
        }
        .suggestions-input::placeholder { color: rgba(255,255,255,0.35); }
        .suggestions-send-btn {
            background: linear-gradient(90deg, var(--neon-pink), #ff7a18);
            border: none; border-radius: 14px; padding: 12px 22px;
            color: #fff; font-weight: 900; font-size: 0.9rem;
            cursor: pointer; transition: all 0.2s ease; white-space: nowrap;
        }
        .suggestions-send-btn:hover { transform: translateY(-2px); box-shadow: 0 0 18px rgba(255,0,85,0.35); }
        .suggestions-send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .suggestions-list { display: flex; flex-direction: column; gap: 10px; max-height: 320px; overflow-y: auto; padding-right: 4px; }
        .suggestions-list::-webkit-scrollbar { width: 6px; }
        .suggestions-list::-webkit-scrollbar-thumb { background: rgba(255,0,85,0.4); border-radius: 3px; }
        .suggestion-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); border-radius: 12px; }
        .suggestion-avatar {
            width: 28px; height: 28px; border-radius: 50%;
            background: linear-gradient(135deg, var(--neon-pink), #ff7a18);
            display: grid; place-items: center;
            font-size: 0.75rem; font-weight: 900; color: #fff; flex-shrink: 0;
            box-shadow: 0 0 12px rgba(255,0,85,0.22);
        }
        .suggestion-text { font-size: 0.82rem; color: rgba(255,255,255,0.78); flex: 1; line-height: 1.4; }
        .suggestion-time { font-size: 0.65rem; color: rgba(255,255,255,0.34); white-space: nowrap; }
        .suggestions-empty { text-align: center; color: rgba(255,255,255,0.36); font-size: 0.8rem; padding: 14px; }
        @keyframes panel-border-flow { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
        @keyframes panel-sweep {
            0% { transform: translateX(-55%); opacity: 0; }
            12% { opacity: 0.45; } 50% { opacity: 0.18; }
            100% { transform: translateX(55%); opacity: 0; }
        }

        /* ── LOADING / INTRO / RUNTIME ── */
        #loading-screen { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #000; z-index: 10000; display: none; 
            flex-direction: column; align-items: center; justify-content: center; 
        }
        .progress-container { width: 80%; max-width: 400px; height: 12px; background: #11131c; border-radius: 20px; margin-top: 30px; border: 1px solid #16192b; overflow: hidden; }
        #progress-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8b00ff); background-size: 200% 100%; animation: rainbow-scroll 2s linear infinite; transition: width 0.3s ease; }
        .loading-info { margin-top: 15px; font-family: monospace; color: var(--neon-blue); font-size: 0.8rem; letter-spacing: 2px; }
        @keyframes rainbow-scroll { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }

        .loading-brand { display: flex; justify-content: center; align-items: center; margin-bottom: 10px; }
        .loading-logo-wrap {
            width: 110px; height: 110px; border-radius: 28px; padding: 8px;
            background: linear-gradient(120deg, rgba(0,210,255,0.78), rgba(255,0,85,0.68), rgba(0,210,255,0.82));
            background-size: 220% 220%;
            animation: panel-border-flow 7s ease-in-out infinite;
            box-shadow: 0 0 26px rgba(0,210,255,0.18), 0 0 24px rgba(255,0,85,0.12);
            display: flex; align-items: center; justify-content: center;
        }
        .loading-logo {
            width: 80px; height: 80px; object-fit: contain;
            display: block; animation: spin 1.2s linear infinite;
            border-radius: 12px;
        }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        #intro-transition {
            position: fixed; inset: 0; background: #000; z-index: 10001;
            display: none; align-items: center; justify-content: center;
            overflow: hidden; pointer-events: none;
        }
        #intro-transition.active { display: flex; }
        #intro-transition .intro-logo {
            width: 70vmin; max-width: 600px; height: auto; object-fit: contain;
            opacity: 0; transform: scale(0.6);
            animation: intro-logo-sega 5s ease-in-out forwards;
            z-index: 2; will-change: transform, opacity;
        }
        @keyframes intro-logo-sega {
            0%   { opacity: 0; transform: scale(0.6); }
            15%  { opacity: 1; transform: scale(1.0); }
            75%  { opacity: 1; transform: scale(1.0); }
            100% { opacity: 0; transform: scale(1.0); }
        }

        #game-runtime { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9998; display: none; }
        #game-frame { width: 100%; height: 100%; border: none; }
        #back-btn { position: fixed; bottom: 25px; right: 25px; z-index: 9999; padding: 12px 25px; background: var(--neon-pink); color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; text-transform: uppercase; box-shadow: 0 0 15px var(--neon-pink); }

        .spinner { width: 50px; height: 50px; border: 5px solid #111; border-top-color: var(--neon-blue); border-radius: 50%; animation: spin 1s linear infinite; }

        #pause-menu { position: fixed; inset: 0; z-index: 99991; background: rgba(0,0,0,0.82); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 20px; backdrop-filter: blur(4px); }
        #pause-menu.active { display: flex; }
        .pause-title { font-size: 2.5rem; font-weight: 900; color: var(--neon-blue); text-transform: uppercase; letter-spacing: 5px; text-shadow: 0 0 20px rgba(0,210,255,0.5); }
        .pause-game-name { font-size: 1rem; color: rgba(255,255,255,0.5); text-align: center; }
        .pause-actions { display: flex; flex-direction: column; gap: 14px; width: 280px; }
        .pause-btn { padding: 14px 20px; border-radius: 14px; font-weight: 800; font-size: 0.95rem; letter-spacing: 1px; cursor: pointer; text-transform: uppercase; transition: all 0.2s ease; text-align: center; }
        .pause-btn-continue { background: linear-gradient(90deg, #00d2ff, #0066aa); color: #fff; border: none; box-shadow: 0 0 20px rgba(0,210,255,0.3); }
        .pause-btn-continue:hover { transform: translateY(-2px); box-shadow: 0 0 30px rgba(0,210,255,0.5); }
        .pause-btn-exit { background: transparent; color: rgba(255,255,255,0.6); border: 1px solid rgba(255,255,255,0.18); }
        .pause-btn-exit:hover { border-color: var(--neon-pink); color: var(--neon-pink); }

        #bubbles-bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
        .bg-particle { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: var(--neon-blue); animation: float-particle linear infinite; opacity: 0; }
        @keyframes float-particle {
            0% { opacity: 0; transform: translateY(100vh) scale(0); }
            10% { opacity: 0.7; }
            90% { opacity: 0.3; }
            100% { opacity: 0; transform: translateY(-10vh) scale(1.5); }
        }
    </style>
    <meta http-equiv="Permissions-Policy" content="camera=(self), microphone=(self)">
</head>
<body>

<div id="bubbles-bg"></div>

<!-- ── BOTÓN DEL LOGO (arriba izquierda) ── -->
<div id="menu-toggle" onclick="togglePanel()">
    <img id="menu-toggle-logo" src="" alt="Menú">
</div>

<!-- ── OVERLAY ── -->
<div id="panel-overlay" onclick="cerrarPanel()"></div>

<!-- ── PANEL LATERAL DE CATEGORÍAS ── -->
<aside id="side-panel">
    <div class="side-panel-title">Categorías</div>
    <button class="cat-btn active" data-category="todos"><img class="cat-icon" src="https://cdn-icons-png.flaticon.com/512/2949/2949874.png" alt=""><span class="cat-label">Todos los juegos</span></button>
    <button class="cat-btn" data-category="aventura"><img class="cat-icon" src="https://cdn-icons-png.flaticon.com/512/8193/8193154.png" alt=""><span class="cat-label">Juegos de Aventura</span></button>
    <button class="cat-btn" data-category="supervivencia"><img class="cat-icon" src="https://images.emojiterra.com/google/android-11/512px/1f525.png" alt=""><span class="cat-label">Supervivencia</span></button>
    <button class="cat-btn" data-category="accion"><img class="cat-icon" src="https://cdn-icons-png.flaticon.com/512/616/616500.png" alt=""><span class="cat-label">Acción</span></button>
    <button class="cat-btn" data-category="escape"><img class="cat-icon" src="https://cdn-icons-png.flaticon.com/512/1864/1864744.png" alt=""><span class="cat-label">Escape</span></button>
    <button class="cat-btn" data-category="misterio"><img class="cat-icon" src="https://cdn-icons-png.flaticon.com/512/751/751381.png" alt=""><span class="cat-label">Misterio</span></button>
    <button class="cat-btn" data-category="construccion"><img class="cat-icon" src="https://cdn-icons-png.flaticon.com/512/8568/8568554.png" alt=""><span class="cat-label">Construcción</span></button>
    <button class="cat-btn" data-category="dos_jugadores"><img class="cat-icon" src="https://cdn-icons-png.flaticon.com/512/4726/4726492.png" alt=""><span class="cat-label">2 Jugadores</span></button>
    <button class="cat-btn" data-category="multijugador"><img class="cat-icon" src="https://cdn-icons-png.flaticon.com/512/8193/8193229.png" alt=""><span class="cat-label">Multijugador</span></button>

    };

    // ══════════════════════════════════════════════════════════════
    // LÓGICA — NO TOCAR
    // ══════════════════════════════════════════════════════════════
    const JUEGOS_POR_PAGINA = 300;
    const STORAGE_KEY = 'ultron_play_counts_v3';
    let currentSort = 'popular';
    let currentCategory = 'todos';
    let currentPage = 1;
    let playCountsCache = {};
    let lastPlayedSlot = null;
    let lastPlayedAt = null;
    let currentGameData = null;
    let isGameRunning = false;
    let introAudioEl = null;
    let currentLang = 'es';

    // ── CATEGORÍAS ──
    const CATEGORIAS = {
        aventura:      { label: 'Juegos de Aventura', match: g => g.tags?.genero?.includes('aventura') },
        supervivencia: { label: 'Supervivencia',        match: g => g.tags?.genero?.includes('terror') || g.tags?.estilo?.includes('supervivencia') },
        accion:        { label: 'Acción',               match: g => g.tags?.genero?.includes('accion') },
        escape:        { label: 'Escape',               match: g => g.tags?.genero?.includes('escape') || g.tags?.estilo?.includes('escape') || (g.tags?.genero?.includes('puzzle') && g.tags?.estilo?.includes('contrarreloj')) },
        misterio:      { label: 'Misterio',             match: g => g.tags?.genero?.includes('misterio') || g.tags?.estilo?.includes('historia') || g.tags?.estilo?.includes('psicologico') },
        construccion:  { label: 'Construcción',         match: g => g.tags?.genero?.includes('sandbox') || g.tags?.genero?.includes('construccion') },
        dos_jugadores: { label: '2 Jugadores',          match: g => g.tags?.modo?.includes('local') || g.tags?.modo?.includes('coop') },
        multijugador:  { label: 'Multijugador',         match: g => g.tags?.modo?.includes('multijugador') || g.tags?.modo?.includes('online') },
        roblox:        { label: 'Roblox',               match: g => g.tags?.genero?.includes('roblox') || g.tags?.ambientacion?.includes('roblox') || (g.titulo||'').toLowerCase().includes('roblox') },
        consola:       { label: 'Consola',              match: g => g.tags?.ambientacion?.includes('consola') || g.tags?.plataforma?.includes('consola') },
        terror:        { label: 'Terror',               match: g => g.tags?.genero?.includes('terror') },
        puzzle:        { label: 'Puzzle',               match: g => g.tags?.genero?.includes('puzzle') },
        deportes:      { label: 'Deportes',             match: g => g.tags?.genero?.includes('deportes') },
        carreras:      { label: 'Carreras',             match: g => g.tags?.genero?.includes('carreras') },
        ritmo:         { label: 'Ritmo',                match: g => g.tags?.genero?.includes('ritmo') },
        simulacion:    { label: 'Simulación',           match: g => g.tags?.genero?.includes('simulacion') },
        sandbox:       { label: 'Sandbox',              match: g => g.tags?.genero?.includes('sandbox') },
        anime:         { label: 'Anime',                match: g => g.tags?.ambientacion?.includes('anime') },
        shooter:       { label: 'Shooter',              match: g => g.tags?.estilo?.includes('shooter') },
        ultron_search: { label: 'Ultron Search',        match: g => (g.titulo||'').toLowerCase().includes('ultron') || (g.titulo||'').toLowerCase().includes('search') },
        todos:         { label: 'Todos los juegos',     match: () => true }
    };

    // ── STORAGE ──
    function getStorage() { try { const t="__ultron_test__"; localStorage.setItem(t,"1"); localStorage.removeItem(t); return localStorage; } catch(e) { return null; } }
    const storage = getStorage();
    function cargarContadoresLocales() { if(!storage) return {}; try { const r=storage.getItem(STORAGE_KEY); return r?JSON.parse(r):{}; } catch(e){ return {}; } }
    function guardarContadoresLocales(d) { if(!storage) return; try { storage.setItem(STORAGE_KEY,JSON.stringify(d)); } catch(e){} }

    // ── CONTADORES ──
    function remoteKey(slot){ return `slot-${slot}`; }
    function getGameCount(g,slot){ return Number(playCountsCache[remoteKey(slot)]||0); }
    async function cargarContadoresGlobales(){
        playCountsCache={...cargarContadoresLocales()};
        try {
            const res=await fetch(`${_getDB2()}/contadores.json`);
            if(!res.ok) return;
            const data=await res.json();
            if(!data) return;
            Object.entries(data).forEach(([key,val])=>{ playCountsCache[key]=Number(val)||0; });
            guardarContadoresLocales(playCountsCache);
        } catch(e){}
    }
    async function incrementarContador(game,slot){
        const key=remoteKey(slot);
        playCountsCache[key]=Number(playCountsCache[key]||0)+1;
        guardarContadoresLocales(playCountsCache);
        try {
            const res=await fetch(`${_getDB2()}/contadores/${key}.json`);
            const current=res.ok?(Number(await res.json())||0):0;
            const nuevo=current+1;
            await fetch(`${_getDB2()}/contadores/${key}.json`,{ method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(nuevo) });
            playCountsCache[key]=nuevo;
            guardarContadoresLocales(playCountsCache);
        } catch(e){}
    }

    // ── PANEL ──
    function togglePanel() {
        document.getElementById('side-panel').classList.toggle('open');
        document.getElementById('panel-overlay').classList.toggle('active');
    }
    function cerrarPanel() {
        document.getElementById('side-panel').classList.remove('open');
        document.getElementById('panel-overlay').classList.remove('active');
    }

    // ── FILTRADO ──
    function getFilteredEntries() {
        const cat = CATEGORIAS[currentCategory] || CATEGORIAS.todos;
        const entries = [];
        for (const [slotStr, game] of Object.entries(CONFIG)) {
            if (!game || !game.url) continue;
            const slot = Number(slotStr);
            if (!cat.match(game)) continue;
            entries.push({ slot, game, titulo: game.titulo || 'Próximamente', count: getGameCount(game, slot) });
        }
        switch (currentSort) {
            case 'popular':   entries.sort((a,b) => (b.count - a.count) || a.titulo.localeCompare(b.titulo,'es')); break;
            case 'unpopular': entries.sort((a,b) => (a.count - b.count) || a.titulo.localeCompare(b.titulo,'es')); break;
            case 'nuevo':     entries.sort((a,b) => b.slot - a.slot); break;
            case 'az':        entries.sort((a,b) => a.titulo.localeCompare(b.titulo,'es')); break;
        }
        return entries;
    }

    // ── CARD ──
    function crearCard(slot, game) {
        const card = document.createElement('div');
        card.className = 'card';
        card.dataset.title = (game ? game.titulo : 'Próximamente').toLowerCase();
        card.dataset.slot = String(slot);
        const tieneImagen = game && game.img && game.img !== '';
        const bgStyle = tieneImagen ? `background-image: url('${game.img}')` : '';
        const titulo = game ? game.titulo : 'Próximamente';
        const cuenta = game ? getGameCount(game, slot) : 0;
        card.innerHTML = `<div class="card-thumb" style="${bgStyle}">${tieneImagen?'':'<span class="empty-icon">?</span>'}</div><div class="card-footer"><div class="card-title">${titulo}</div><div class="card-meta"><div class="card-popularity">👥 ${cuenta}</div></div></div>`;
        if (game && game.url) card.onclick = () => lanzarJuego(game, slot);
        return card;
    }

    // ── RENDER ──
    function renderMenu() {
        const grid = document.getElementById('main-grid');
        const title = document.getElementById('grid-title');
        const entries = getFilteredEntries();
        const totalPages = Math.max(1, Math.ceil(entries.length / JUEGOS_POR_PAGINA));
        if (currentPage > totalPages) currentPage = totalPages;
        if (currentPage < 1) currentPage = 1;

        const start = (currentPage - 1) * JUEGOS_POR_PAGINA;
        const end = start + JUEGOS_POR_PAGINA;
        const pageEntries = entries.slice(start, end);

        title.textContent = `${CATEGORIAS[currentCategory].label} (${entries.length})`;

        grid.innerHTML = '';
        if (pageEntries.length === 0) {
            grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:60px 20px; color:rgba(255,255,255,0.4); font-weight:700;">No hay juegos en esta categoría todavía.</div>';
        } else {
            for (const item of pageEntries) grid.appendChild(crearCard(item.slot, item.game));
        }

        renderPaginacion(totalPages, entries.length);
        actualizarBusqueda();
    }

    // ── PAGINACIÓN ──
    function renderPaginacion(totalPages, totalJuegos) {
        const cont = document.getElementById('pagination');
        cont.innerHTML = '';
        if (totalPages <= 1) return;

        const crearBtn = (txt, page, disabled=false, active=false) => {
            const b = document.createElement('button');
            b.className = 'page-btn' + (active ? ' active' : '');
            b.textContent = txt;
            b.disabled = disabled;
            if (!disabled && !active) b.onclick = () => { currentPage = page; renderMenu(); window.scrollTo({top:0, behavior:'smooth'}); };
            return b;
        };

        cont.appendChild(crearBtn('«', 1, currentPage === 1));
        cont.appendChild(crearBtn('‹', currentPage - 1, currentPage === 1));

        const rango = 2;
        let start = Math.max(1, currentPage - rango);
        let end = Math.min(totalPages, currentPage + rango);
        if (start > 1) {
            cont.appendChild(crearBtn('1', 1, false, currentPage === 1));
            if (start > 2) cont.appendChild(Object.assign(document.createElement('span'), {className:'page-info', textContent:'...'}));
        }
        for (let i = start; i <= end; i++) cont.appendChild(crearBtn(String(i), i, false, i === currentPage));
        if (end < totalPages) {
            if (end < totalPages - 1) cont.appendChild(Object.assign(document.createElement('span'), {className:'page-info', textContent:'...'}));
            cont.appendChild(crearBtn(String(totalPages), totalPages, false, currentPage === totalPages));
        }

        cont.appendChild(crearBtn('›', currentPage + 1, currentPage === totalPages));
        cont.appendChild(crearBtn('»', totalPages, currentPage === totalPages));

        const info = document.createElement('span');
        info.className = 'page-info';
        info.textContent = `Página ${currentPage} de ${totalPages} (${totalJuegos} juegos)`;
        cont.appendChild(info);
    }

    // ── BÚSQUEDA ──
    function actualizarBusqueda() {
        const input = document.getElementById('search-input');
        const query = (input?.value || '').trim().toLowerCase();
        const cards = document.querySelectorAll('#main-grid .card');
        cards.forEach(card => {
            const titulo = card.dataset.title || '';
            const coincide = !query || titulo.includes(query);
            card.classList.toggle('hidden', !coincide);
        });
    }

    // ── INTRO ──
    function reproducirIntroCinematica(onComplete) {
        const intro = document.getElementById('intro-transition');
        const img = document.getElementById('intro-logo-img');
        img.src = LOGO_INTRO_URL;
        intro.classList.remove('active');
        void intro.offsetWidth;
        intro.classList.add('active');
        try {
            if (!introAudioEl) { introAudioEl = new Audio(INTRO_SOUND_URL); introAudioEl.preload='auto'; introAudioEl.volume=0.9; }
            introAudioEl.currentTime = 0;
            const p = introAudioEl.play();
            if (p && p.catch) p.catch(()=>{});
        } catch(e){}
        setTimeout(() => {
            intro.classList.remove('active');
            if (typeof onComplete === 'function') onComplete();
        }, 5000);
    }

    // ── LANZAR JUEGO ──
    async function lanzarJuego(game, slot) {
        await incrementarContador(game, slot);
        lastPlayedSlot = Number(slot);
        lastPlayedAt = new Date().toISOString();

        const menu = document.getElementById('menu-view');
        const loader = document.getElementById('loading-screen');
        const runtime = document.getElementById('game-runtime');
        const frame = document.getElementById('game-frame');
        const progressBar = document.getElementById('progress-bar');
        const loadingStats = document.getElementById('loading-stats');

        menu.style.display = 'none';
        loader.style.display = 'flex';
        runtime.style.display = 'none';
        isGameRunning = false;
        currentGameData = game;

        try { localStorage.setItem('ultron_last_game', JSON.stringify(game)); } catch(e){}

        frame.onload = null;
        frame.src = 'about:blank';
        let loaded = false;
        let progress = 0;
        const estimatedLoadMs = 5000;
        const start = performance.now();
        const hardTimeoutMs = 9000;
        progressBar.style.width = '0%';
        loadingStats.innerText = 'SINCRONIZANDO: 0%';

        const interval = setInterval(() => {
            const elapsed = performance.now() - start;
            const target = Math.min(94, (elapsed / estimatedLoadMs) * 94);
            progress = Math.max(progress, target);
            progressBar.style.width = progress.toFixed(1) + '%';
            loadingStats.innerText = `SINCRONIZANDO: ${Math.round(progress)}%`;
            if (!loaded && elapsed > hardTimeoutMs) finishLoading(true);
        }, 80);

        const finishLoading = (force=false) => {
            if (loaded && !force) return;
            loaded = true;
            clearInterval(interval);
            progressBar.style.width = '100%';
            loadingStats.innerText = '¡SISTEMA LISTO!';
            setTimeout(() => {
                loader.style.display = 'none';
                reproducirIntroCinematica(() => {
                    runtime.style.display = 'block';
                    isGameRunning = true;
                    if (game.pointerLock) {
                        runtime.addEventListener('click', () => { try { frame.contentDocument?.body?.requestPointerLock?.(); } catch(e){} });
                        document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && document.pointerLockElement) document.exitPointerLock?.(); });
                    }
                });
            }, 650);
        };

        frame.onload = () => {
            if (frame.src === 'about:blank') return;
            progress = Math.max(progress, 96);
            progressBar.style.width = '96%';
            loadingStats.innerText = 'SINCRONIZANDO: 96%';
            setTimeout(() => finishLoading(), 500);
        };
        frame.src = game.url;
    }

    function cerrarJuego() {
        document.getElementById('game-runtime').style.display = 'none';
        document.getElementById('game-frame').src = 'about:blank';
        document.getElementById('menu-view').style.display = 'block';
        document.getElementById('pause-menu').classList.remove('active');
        isGameRunning = false;
        currentGameData = null;
        window.scrollTo(0, 0);
        renderMenu();
    }
    function continuarJuego() { document.getElementById('pause-menu').classList.remove('active'); }

    // ── SUGERENCIAS ──
    function escapeHTML(str){ return (str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

    async function cargarSugerenciasFirebase(){
        try {
            const res = await fetch(`${_getDB()}/sugerencias.json`);
            if(!res.ok) return [];
            const data = await res.json();
            if(!data) return [];
            return Object.values(data)
                .filter(s => !s.lang || s.lang === currentLang)
                .sort((a,b) => (b.time > a.time ? 1 : -1))
                .slice(0, 50);
        } catch(e){ return []; }
    }

    async function guardarSugerenciaFirebase(text){
        try {
            const now = new Date();
            const timeStr = now.toLocaleDateString('es-ES', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });
            const item = { text, time: now.toISOString(), timeStr, lang: currentLang };
            const res = await fetch(`${_getDB()}/sugerencias.json`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(item)
            });
            return res.ok;
        } catch(e){ return false; }
    }

    async function renderSugerencias(){
        const container = document.getElementById('suggestions-list');
        if(!container) return;
        container.innerHTML = `<div class="suggestions-empty" style="opacity:0.5">⏳ Cargando...</div>`;
        const list = await cargarSugerenciasFirebase();
        if(!list.length){
            container.innerHTML = `<div class="suggestions-empty">Aún no hay sugerencias. ¡Sé el primero!</div>`;
            return;
        }
        container.innerHTML = list.map(s => {
            const initials = (s.text||'?').charAt(0).toUpperCase();
            const timeLabel = s.timeStr || s.time || '';
            return `<div class="suggestion-item"><div class="suggestion-avatar">${initials}</div><div class="suggestion-text">${escapeHTML(s.text)}</div><div class="suggestion-time">${timeLabel}</div></div>`;
        }).join('');
    }

    async function enviarSugerencia(){
        const input = document.getElementById('suggestion-input');
        const btn = document.getElementById('suggestion-send-btn');
        const text = (input?.value || '').trim();
        if(!text) return;
        if(btn){ btn.disabled = true; btn.style.opacity = '0.5'; }
        const ok = await guardarSugerenciaFirebase(text);
        if(ok){
            input.value = '';
            await renderSugerencias();
        } else {
            alert('No se pudo enviar la sugerencia. Inténtalo de nuevo.');
        }
        if(btn){ btn.disabled = false; btn.style.opacity = '1'; }
    }

    // ── INIT ──
    async function initUltron() {
        // Logos
        const logoBtn = document.getElementById('menu-toggle-logo');
        if (logoBtn) logoBtn.src = LOGO_MENU_URL;
        const logoImg = document.getElementById('ultron-logo');
        if (logoImg) logoImg.src = LOGO_HEADER_URL;
        const loadingLogo = document.getElementById('loading-logo');
        if (loadingLogo) loadingLogo.src = LOGO_LOADING_URL;

        initBubbles();

        // Orden
        const sortSelect = document.getElementById('sort-select');
        if (sortSelect) {
            sortSelect.value = currentSort;
            sortSelect.addEventListener('change', () => { currentSort = sortSelect.value; currentPage = 1; renderMenu(); });
        }

        // Búsqueda
        const input = document.getElementById('search-input');
        if (input) {
            input.addEventListener('input', actualizarBusqueda);
            input.addEventListener('keydown', (e) => { if (e.key === 'Escape') { input.value=''; actualizarBusqueda(); input.blur(); } });
        }

        // Categorías
        document.querySelectorAll('.cat-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentCategory = btn.dataset.category;
                currentPage = 1;
                cerrarPanel();
                renderMenu();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        });

        // Enter en sugerencias
        const sugInput = document.getElementById('suggestion-input');
        if (sugInput) sugInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') enviarSugerencia(); });

        // Cargar datos
        await cargarContadoresGlobales();
        renderMenu();
        renderSugerencias();
    }
    window.addEventListener('load', initUltron);

    function initBubbles() {
        const c = document.getElementById('bubbles-bg');
        if (!c) return;
        for (let i = 0; i < 60; i++) {
            const p = document.createElement('div');
            p.className = 'bg-particle';
            p.style.cssText = `left:${Math.random()*100}%; width:${Math.random()*3+1}px; height:${Math.random()*3+1}px; animation-duration:${Math.random()*8+6}s; animation-delay:${Math.random()*8}s; opacity:0;`;
            c.appendChild(p);
        }
    }
</script>
