<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | OVENLESS BROWNIES</title>
    
    <style>
      /* 1. Quita márgenes, rellenos y las barras de scroll (flechas) */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden; /* Esto elimina las flechas por completo */
        background-color: #231F20; /* Color de fondo oscuro */
      }

      /* 2. Hace que el contenedor de Unity ocupe el 100% de la ventana */
      #unityContainer {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      /* 3. Fuerza al canvas que genera Unity a ajustarse a la pantalla */
      canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
    </style>

    <script src="Build/UnityLoader.js"></script>
    <script>
      UnityLoader.instantiate("unityContainer", "Build/OBWEB2.json");
    </script>
  </head>
  <body>
    <!-- Quitamos el style en línea porque ahora lo controla el CSS de arriba -->
    <div id="unityContainer"></div>
  </body>
</html>
