<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Unity WebGL Player | Odio el chocolate</title>
    
    <style>
      /* Reseteamos márgenes para que no haya bordes ni scroll */
      html, body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden; /* Elimina las flechas/barras de desplazamiento */
        background-color: #000; /* Fondo negro por si tarda en cargar */
      }

      /* Hacemos que el contenedor de Unity ocupe toda la ventana */
      #unityContainer {
        width: 100vw;
        height: 100vh;
        display: block;
      }

      /* Forzamos al canvas interno de Unity a adaptarse al contenedor */
      canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
    </style>
  </head>

  <body>
    <!-- Contenedor del juego -->
    <div id="unityContainer"></div>

    <!-- Scripts de Unity -->
    <script src="Build/UnityLoader.js"></script>
    <script>
      // Iniciamos el juego con el nombre exacto de tu archivo JSON
      UnityLoader.instantiate("unityContainer", "Build/OCWEB2.json");
    </script>
  </body>
</html>
