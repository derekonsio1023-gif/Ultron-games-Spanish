<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08283f">
  <title>Hungry Shark Evolution</title>
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:#071b2d;color:#fff;font-family:Arial,sans-serif;overflow:hidden}
    #game{position:relative;width:100%;height:100%;display:grid;place-items:center;background:radial-gradient(circle at 50% 15%,#137ab2 0%,#073653 55%,#061626 100%)}
    #unity-canvas{display:block;width:min(100vw,177.7778vh);height:min(100vh,56.25vw);max-width:100%;max-height:100%;background:#000;touch-action:none}
    #overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:linear-gradient(#08456bde,#061827ee);text-align:center;padding:24px;z-index:2}
    #overlay[hidden]{display:none}h1{font-size:clamp(26px,5vw,48px);margin:0}p{margin:0;max-width:34em;line-height:1.5}
    #play{font:700 20px Arial,sans-serif;border:0;border-radius:999px;padding:16px 48px;background:#ffcd32;color:#092233;cursor:pointer}
    #play[hidden]{display:none}#status{font-size:14px;color:#d5eeff}#progress{width:min(340px,75vw);height:10px;accent-color:#ffcd32}#progress[hidden]{display:none}
    #fullscreen{position:absolute;right:12px;bottom:12px;z-index:1;background:#061827bb;color:#fff;border:1px solid #fff8;border-radius:8px;padding:8px 10px;cursor:pointer}
  </style>
</head>
<body>
  <main id="game">
    <canvas id="unity-canvas" tabindex="0" aria-label="Hungry Shark Evolution game" width="1620" height="911"></canvas>
    <button id="fullscreen" type="button" aria-label="Fullscreen">⛶</button>
    <section id="overlay">
      <h1>Hungry Shark Evolution</h1>
      <p>Swim, hunt and survive in the ocean.</p>
      <button id="play" type="button">Play</button>
      <progress id="progress" max="1" value="0" hidden=""></progress>
      <div id="status" role="status"></div>
    </section>
  </main>
  <script src="local-bridge.js"></script>
  <script src="hseyoutube.loader.js"></script>
  <script src="game.js"></script>
