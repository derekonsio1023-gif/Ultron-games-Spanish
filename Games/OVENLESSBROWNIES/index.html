<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OVENLESS BROWNIES</title>

  <style>
    /* Reseteamos márgenes para que no haya bordes blancos */
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden; /* Evita las flechas de scroll */
      background-color: #000; /* Fondo negro por si tarda en cargar */
    }

    /* El contenedor de Unity ocupa toda la ventana */
    #unityContainer {
      width: 100vw;
      height: 100vh;
      display: block;
    }

    /* Forzamos al canvas interno de Unity a estirarse */
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>

<body>
  <!-- Contenedor donde Unity inyectará el juego -->
  <div id="unityContainer"></div>

  <!-- Cargamos el motor de Unity -->
  <script src="Build/UnityLoader.js"></script>
  
  <!-- Iniciamos el juego directamente -->
  <script>
    UnityLoader.instantiate("unityContainer", "Build/OBWEB2.json");
  </script>
</body>
</html>
