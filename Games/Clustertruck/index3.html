<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>Clustertruck</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000;
      }
      #unity-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        transform: none;
      }
      #unity-canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #000;
        outline: none;
      }
      #unity-footer { display: none; }
      #unity-loading-bar {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        display: none;
      }
      #unity-status {
        margin-top: 12px;
        width: 154px;
        text-align: center;
        font-family: arial, sans-serif;
        font-size: 12px;
        color: #bbb;
        white-space: nowrap;
      }
      #unity-warning {
        position: absolute;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        background: transparent;
      }
      #unity-error {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        display: none;
        max-width: 80%;
        padding: 16px 20px;
        background: #2a1414;
        border: 1px solid #a33;
        color: #f4d5d5;
        font-family: arial, sans-serif;
        font-size: 14px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
        <div id="unity-status"></div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-error"></div>
    </div>
    <script>

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var statusText = document.querySelector("#unity-status");
      var warningBanner = document.querySelector("#unity-warning");
      var errorBox = document.querySelector("#unity-error");

      function showError(msg) {
        loadingBar.style.display = "none";
        errorBox.style.display = "block";
        errorBox.innerHTML = msg;
      }

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/ClusterTruckWEB.loader.js";
      var dataUrl = buildUrl + "/ClusterTruckWEB.data";
      var wasmUrl = buildUrl + "/ClusterTruckWEB.wasm";

      // =======================================================================================
      // CONFIGURACIÓN DE PARTES
      // =======================================================================================
      // Cambia estos dos números según cuántas partes haya en tu repo de GitHub.
      //   - Si ClusterTruckWEB.data está partido en .part1, .part2, .part3 -> pon 3
      //   - Si ClusterTruckWEB.data está entero (sin .partN)               -> pon 0
      //   - Lo mismo para el wasm.
      //
      // Deben coincidir EXACTAMENTE con lo que hay en la carpeta Build/ de tu repo.
      var NUM_DATA_PARTS = 6;   // <<< AJUSTA AQUÍ (partes de ClusterTruckWEB.data)
      var NUM_WASM_PARTS = 5;   // <<< AJUSTA AQUÍ (partes de ClusterTruckWEB.wasm)

      // =======================================================================================
      // Reensamblado de archivos partidos.
      //
      // Descarga en orden <archivo>.part1, .part2, ... y los concatena en un Blob. Unity
      // recibe un blob: URL en lugar de la ruta real. Los blob: URLs heredan el MIME del
      // Blob, y WebAssembly.instantiateStreaming exige "application/wasm" para el wasm.
      //
      // NOTA: NO usamos peticiones HEAD para descubrir las partes porque raw.githack.com
      // responde 403 a HEAD, lo cual hacía fallar toda la carga con
      // "both async and sync fetching of the wasm failed".
      // =======================================================================================

      function buildPlan(url, count) {
        var arr = [];
        for (var i = 1; i <= count; i++) {
          arr.push({ url: url + ".part" + i, size: 0 });
        }
        return arr;
      }

      // Streams one part, reporting bytes as they arrive.
      async function fetchPart(url, onBytes) {
        var res = await fetch(url);
        if (!res.ok) throw new Error("Failed to fetch " + url + " (HTTP " + res.status + ")");
        if (!res.body) {
          var buf = await res.arrayBuffer();
          onBytes(buf.byteLength);
          return buf;
        }
        var reader = res.body.getReader();
        var chunks = [];
        var total = 0;
        while (true) {
          var step = await reader.read();
          if (step.done) break;
          chunks.push(step.value);
          total += step.value.length;
          onBytes(step.value.length);
        }
        var out = new Uint8Array(total);
        var offset = 0;
        for (var i = 0; i < chunks.length; i++) {
          out.set(chunks[i], offset);
          offset += chunks[i].length;
        }
        return out;
      }

      var objectUrls = [];

      async function resolveUrl(url, mimeType, label, plan, onBytes) {
        var parts = plan[url];
        if (!parts || !parts.length) return url;   // no está partido - se usa el archivo tal cual

        var buffers = [];
        for (var i = 0; i < parts.length; i++) {
          statusText.textContent = "Downloading " + label + " (" + (i + 1) + "/" + parts.length + ")";
          buffers.push(await fetchPart(parts[i].url, onBytes));
        }
        var blob = new Blob(buffers, { type: mimeType });
        var objUrl = URL.createObjectURL(blob);
        objectUrls.push(objUrl);
        return objUrl;
      }

      async function boot() {
        loadingBar.style.display = "block";
        statusText.textContent = "Preparing...";

        var plan = {};
        plan[dataUrl] = buildPlan(dataUrl, NUM_DATA_PARTS);
        plan[wasmUrl] = buildPlan(wasmUrl, NUM_WASM_PARTS);

        // No conocemos los tamaños sin HEAD, así que la barra avanzará de forma estimada
        // según cuántas partes se hayan descargado.
        var totalParts = plan[dataUrl].length + plan[wasmUrl].length;
        var doneParts = 0;
        function bumpProgress() {
          doneParts++;
          if (totalParts > 0) {
            progressBarFull.style.width = (doneParts / totalParts * 90) + "%";
          }
        }
        function onBytes(_n) { /* no usado sin tamaños conocidos */ }

        // Envolvemos resolveUrl para ir moviendo la barra por partes completadas.
        async function resolveUrlWithProgress(url, mime, label) {
          var parts = plan[url];
          if (!parts || !parts.length) return url;
          var buffers = [];
          for (var i = 0; i < parts.length; i++) {
            statusText.textContent = "Downloading " + label + " (" + (i + 1) + "/" + parts.length + ")";
            buffers.push(await fetchPart(parts[i].url, onBytes));
            bumpProgress();
          }
          var blob = new Blob(buffers, { type: mime });
          var objUrl = URL.createObjectURL(blob);
          objectUrls.push(objUrl);
          return objUrl;
        }

        var resolvedData = await resolveUrlWithProgress(dataUrl, "application/octet-stream", "game data");
        var resolvedWasm = await resolveUrlWithProgress(wasmUrl, "application/wasm", "engine");

        statusText.textContent = "Starting...";

        var config = {
          dataUrl: resolvedData,
          frameworkUrl: buildUrl + "/ClusterTruckWEB.framework.js",
          codeUrl: resolvedWasm,
          streamingAssetsUrl: "StreamingAssets",
          companyName: "Landfall",
          productName: "Clustertruck",
          productVersion: "1.0",
          showBanner: unityShowBanner,
        };

        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
          container.className = "unity-mobile";
          canvas.className = "unity-mobile";
        }

        await new Promise(function (resolve, reject) {
          var script = document.createElement("script");
          script.src = loaderUrl;
          script.onload = resolve;
          script.onerror = function () { reject(new Error("Failed to load " + loaderUrl)); };
          document.body.appendChild(script);
        });

        var unityInstance = await createUnityInstance(canvas, config, function (progress) {
          progressBarFull.style.width = (90 + progress * 10) + "%";
        });

        loadingBar.style.display = "none";

        // Liberar los Blobs (~190 MB) una vez Unity los ha leído.
        objectUrls.forEach(function (u) { URL.revokeObjectURL(u); });
        objectUrls = [];

        // Fullscreen con la tecla F (el botón del footer está oculto por CSS).
        window.addEventListener("keydown", function (e) {
          if (e.key === "F" || e.key === "f") {
            if (e.target === document.body || e.target === canvas) {
              unityInstance.SetFullscreen(1);
            }
          }
        });
      }

      boot().catch(function (err) {
        showError("<b>Failed to start.</b><br>" + (err && err.message ? err.message : err));
        console.error(err);
      });

    </script>
  </body>
</html>
