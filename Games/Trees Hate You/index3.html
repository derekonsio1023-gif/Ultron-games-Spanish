<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Cargando…</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
</head>
<body>
<script>
const ENTRY = 'index.html';
const GAME_URL = new URL(ENTRY, location.href).href;
const BASE_DIR = GAME_URL.replace(/[^/]*$/, '');

// URL base remota que usa el juego (jsDelivr)
const REMOTE_BASE = 'https://cdn.jsdelivr.net/gh/thirstygithub/fugglelatougin@main/';
// URL base local en tu repositorio (githack)
const LOCAL_BASE = BASE_DIR; // Ej: https://raw.githack.com/.../Trees%20Hate%20You/

function ULTRON_BROTLI_FIX() {
  try {
    console.log('[LOADER] Aplicando fix de Brotli...');
    const _fetch = window.fetch;

    window.fetch = function(input, init) {
      let url = typeof input === 'string' ? input : (input && input.url) || '';

      // Reescribir URLs de jsDelivr a local
      if (url.startsWith('https://cdn.jsdelivr.net/gh/thirstygithub/fugglelatougin@main/')) {
        url = url.replace('https://cdn.jsdelivr.net/gh/thirstygithub/fugglelatougin@main/', LOCAL_BASE);
        console.log('[LOADER] URL reescrita a local:', url);
      }

      // Forzar que no se descomprima (aunque el navegador lo ignora, se mantiene por si acaso)
      if (/\.br(\.part\d+)?($|\?)/i.test(url)) {
        init = init || {};
        init.headers = new Headers(init.headers || {});
        init.headers.set('Accept-Encoding', 'identity');
        console.log('[LOADER] Fetch interceptado (sin descompresión):', url);
      }

      // Usar la URL reescrita
      const newInput = typeof input === 'string' ? url : new Request(url, input);

      return _fetch.call(this, newInput, init).then(function(response) {
        if (/\.br(\.part\d+)?($|\?)/i.test(url) && response.ok) {
          const newHeaders = new Headers(response.headers);
          newHeaders.delete('Content-Encoding');
          return new Response(response.body, {
            status: response.status,
            statusText: response.statusText,
            headers: newHeaders
          });
        }
        return response;
      });
    };
    console.log('[LOADER] Fix de Brotli aplicado correctamente.');
  } catch (e) {
    console.error('[LOADER] Error aplicando el fix de Brotli:', e);
  }
}

// El resto del loader (inyección del shim, fetch del index.html, etc.) permanece igual
(function() {
  const LT = String.fromCharCode(60);
  const GT = String.fromCharCode(62);
  const SL = String.fromCharCode(47);
  const EC = LT + SL + 'script' + GT;

  const SHIM_SOURCE = '(' + ULTRON_BROTLI_FIX.toString() + ')();';
  const SHIM_BLOB = new Blob([SHIM_SOURCE], { type: 'application/javascript' });
  const SHIM_URL = URL.createObjectURL(SHIM_BLOB);
  const SHIM_TAG = LT + 'script src="' + SHIM_URL + '"' + GT + EC;

  console.log('[LOADER] Cargando', GAME_URL);

  fetch(GAME_URL)
    .then(r => r.text())
    .then(html => {
      html = html.replace(/<head([^>]*)>/i, '<head$1><base href="' + BASE_DIR + '">');

      let injected = false;
      const tryAt = (re, after) => {
        if (injected) return;
        const m = re.exec(html);
        if (!m) return;
        const pos = after ? m.index + m[0].length : m.index;
        html = html.slice(0, pos) + SHIM_TAG + html.slice(pos);
        injected = true;
      };

      tryAt(/<script\b/i, false);
      tryAt(/<\/head\s*>/i, false);
      tryAt(/<body\b/i, false);
      if (!injected) html = SHIM_TAG + html;

      console.log('[LOADER] Inyectado:', injected);

      document.open();
      document.write(html);
      document.close();
    })
    .catch(e => {
      console.error('[LOADER] Error fatal:', e);
      document.body.innerHTML = 'Error: ' + (e && e.message ? e.message : e);
    });
})();
</script>
</body>
</html>
