<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#050505">
    <meta name="robots" content="noindex">

    <title>Play Classic Us | AUAD</title>

    <link rel="preload" href="/assets/css/Brook.otf" as="font" type="font/otf" crossorigin>
    <link rel="stylesheet" href="/assets/css/site.css">

    <style>
        html, body { height: 100%; overflow: hidden; }

        body {
            display: flex;
            flex-direction: column;
            height: 100dvh;
            overscroll-behavior: none;
        }

        .gamebar {
            flex: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            height: 56px;
            padding: 0 20px;
            background: rgba(5, 5, 5, .85);
            border-bottom: 1px solid var(--hair);
        }

        .gamebar .left { display: flex; align-items: baseline; gap: 14px; }
        .gamebar .logo { font-size: 34px; }
        .gamebar .title { font-size: 14px; color: var(--dim); }
        .gamebar .right { display: flex; align-items: center; gap: 24px; }
        .gamebar .right a {
            font-family: 'The Brook', sans-serif;
            font-size: 24px;
            line-height: 1;
            padding-top: 4px;
            text-decoration: none;
            color: var(--text);
        }
        .gamebar .right a:hover { color: var(--hover); }
        .gamebar .btn { font-size: 22px; padding: 3px 14px 1px; border-width: 3px; border-radius: 10px; }

        .stage {
            position: relative;
            flex: 1;
            min-height: 0;
            background: #000;
        }

        #unity-canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #000;
            outline: none;
        }

        .loader {
            position: absolute;
            inset: 0;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            background: var(--bg) url('/assets/png/bg.png') repeat;
            background-size: 700px auto;
            transition: opacity .5s;
        }

        .loader.done { opacity: 0; pointer-events: none; }

        .loader::before {
            content: '';
            position: absolute;
            inset: 0;
            background: url('/assets/png/hero.png') center 30% / cover no-repeat;
            opacity: .22;
            filter: blur(2px);
            -webkit-mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%);
            mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%);
        }

        .loader-box {
            position: relative;
            width: 100%;
            max-width: 620px;
            text-align: center;
        }

        .loader h1 {
            font-size: clamp(64px, 12vw, 128px);
            margin-bottom: 34px;
        }

        .taskbar {
            position: relative;
            height: 46px;
            border: 4px solid #000;
            outline: 3px solid #4b4b4b;
            border-radius: 4px;
            background: #3c3c3c;
            overflow: hidden;
            text-align: left;
        }

        .taskbar-fill {
            position: absolute;
            inset: 0 auto 0 0;
            width: 0%;
            background: #44d62c;
            box-shadow: inset 0 -6px 0 rgba(0, 0, 0, .18), inset 0 4px 0 rgba(255, 255, 255, .25);
            transition: width .25s linear;
        }

        .taskbar-label {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            padding: 3px 14px 0;
            font-family: 'The Brook', sans-serif;
            font-size: 28px;
            color: #fff;
            text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .loader-meta {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-top: 16px;
            font-size: 15px;
            color: var(--text);
        }

        .loader-meta .pct { color: var(--white); font-variant-numeric: tabular-nums; }
        .loader-meta .bytes { font-variant-numeric: tabular-nums; }

        .loader-note {
            margin-top: 26px;
            font-size: 14px;
            color: var(--dim);
        }

        .loader-error { display: none; }
        .loader.failed .loader-progress { display: none; }
        .loader.failed .loader-error { display: block; }

        .loader-error h2 { font-size: 22px; margin: 0 0 8px; color: #ff4040; }
        .loader-error p { color: var(--text); margin: 0 0 6px; }
        .loader-error code {
            display: block;
            margin: 14px 0 24px;
            font-family: Consolas, 'Courier New', monospace;
            font-size: 13px;
            color: var(--dim);
            word-break: break-word;
        }
        .loader-error .btn-row { justify-content: center; }

        @media (max-width: 640px) {
            .gamebar { height: 48px; padding: 0 12px; }
            .gamebar .logo { font-size: 30px; }
            .gamebar .title, .gamebar .hide-sm { display: none; }
            .taskbar { height: 40px; }
            .taskbar-label { font-size: 24px; }
            .loader-meta { font-size: 14px; }
        }

        @media (max-height: 500px) and (orientation: landscape) {
            .gamebar { display: none; }
            .loader h1 { font-size: 56px; margin-bottom: 18px; }
        }
    </style>
</head>

<body>
    <header class="gamebar">
        <div class="left">
            <a href="/" class="logo">AUAD</a>
            <span class="title">Classic Us &middot; Web</span>
        </div>
        <div class="right">
            <a href="/leaderboard" class="hide-sm">Leaderboard</a>
            <a href="https://discord.gg/ApDDJKmANg" class="hide-sm">Discord</a>
            <a href="/rules" class="hide-sm">Rules</a>
            <button type="button" class="btn" id="fullscreen-btn">Fullscreen</button>
        </div>
    </header>

    <main class="stage">
        <canvas id="unity-canvas" tabindex="-1"></canvas>

        <div class="loader" id="loader">
            <div class="loader-box">
                <h1 class="display">Classic Us</h1>

                <div class="loader-progress">
                    <div class="taskbar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="taskbar">
                        <div class="taskbar-fill" id="taskbar-fill"></div>
                        <div class="taskbar-label" id="taskbar-label">Downloading game</div>
                    </div>
                    <div class="loader-meta">
                        <span class="bytes" id="loader-bytes">Connecting&hellip;</span>
                        <span class="pct" id="loader-pct">0%</span>
                    </div>
                    <div class="loader-note">Big download the first time. Keep this tab open.</div>
                </div>

                <div class="loader-error">
                    <h2>The game couldn't start.</h2>
                    <p>Try reloading. If it keeps happening, tell us on Discord.</p>
                    <code id="loader-error-msg"></code>
                    <div class="btn-row">
                        <button type="button" class="btn btn-sm" onclick="location.reload()">Retry</button>
                        <a class="btn btn-sm" href="https://discord.gg/ApDDJKmANg">Discord</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
    const SERVER_HOSTS = {
        "178.156.171.131": "na.realauad.com",
        "46.62.194.17":    "eu.realauad.com",
    };

    const API_HOST = "api.realauad.com";
    const downloads = {};
    const loader = document.getElementById("loader");
    const bar = document.getElementById("taskbar");
    const fill = document.getElementById("taskbar-fill");
    const label = document.getElementById("taskbar-label");
    const bytesEl = document.getElementById("loader-bytes");
    const pctEl = document.getElementById("loader-pct");

    const mb = n => (n / 1048576).toFixed(n < 10485760 ? 1 : 0) + " MB";
    let shown = 0;

    function rewriteServerUrl(raw) {
        let url;
        try { url = new URL(String(raw), location.href); } catch { return raw; }
        const isApi = url.pathname.startsWith("/account/") || url.port === "22030";

        if (url.hostname === "na.realauad.com") {
            if (!isApi) return raw;
            url.hostname = API_HOST;
            return url.href;
        }

        let host = SERVER_HOSTS[url.hostname];
        if (!host) return raw;
        if (isApi) host = API_HOST;
        url.protocol = url.protocol.startsWith("ws") ? "wss:" : "https:";
        url.hostname = host;
        url.port = "";
        return url.href;
    }

    (function () {
        const nativeFetch = window.fetch.bind(window);
        window.fetch = function (input, init) {
            if (input instanceof Request) {
                const to = rewriteServerUrl(input.url);
                return nativeFetch(to === input.url ? input : new Request(to, input), init);
            }
            return nativeFetch(rewriteServerUrl(input), init);
        };

        const open = XMLHttpRequest.prototype.open;
        XMLHttpRequest.prototype.open = function (method, url, ...rest) {
            return open.call(this, method, rewriteServerUrl(url), ...rest);
        };

        const NativeWebSocket = window.WebSocket;
        function RewrittenWebSocket(url, protocols) {
            return protocols === undefined
                ? new NativeWebSocket(rewriteServerUrl(url))
                : new NativeWebSocket(rewriteServerUrl(url), protocols);
        }
        RewrittenWebSocket.prototype = NativeWebSocket.prototype;
        Object.setPrototypeOf(RewrittenWebSocket, NativeWebSocket);
        window.WebSocket = RewrittenWebSocket;
    })();

    const realFetch = window.fetch.bind(window);

    window.fetch = async function (input, init) {
        const res = await realFetch(input, init);
        const url = typeof input === "string" ? input : input.url;
        if (!/(^|\/)Build\//.test(decodeURI(url)) || /symbols/.test(url) || !res.body) return res;

        const total = Number(res.headers.get("content-length")) || 0;
        const entry = downloads[url] = { loaded: 0, total };
        const reader = res.body.getReader();
        const counted = new ReadableStream({
            async pull(controller) {
                const { done, value } = await reader.read();
                if (done) { entry.loaded = entry.total || entry.loaded; controller.close(); return; }
                entry.loaded += value.byteLength;
                controller.enqueue(value);
            },
            cancel(reason) { reader.cancel(reason); }
        });
        const wrapped = new Response(counted, { status: res.status, statusText: res.statusText, headers: res.headers });
        Object.defineProperty(wrapped, "url", { value: res.url });
        return wrapped;
    };

    function render(unityProgress) {
        let loaded = 0, total = 0, unknownSize = false;
        for (const d of Object.values(downloads)) {
            loaded += d.loaded;
            if (d.total) total += d.total; else unknownSize = true;
        }

        let pct;
        if (unityProgress >= 0.9) {
            pct = 90 + (unityProgress - 0.9) * 100;
            label.textContent = "Starting up";
            bytesEl.textContent = total ? mb(total) + " downloaded" : "Almost there…";
        } else if (total && !unknownSize) {
            pct = (loaded / total) * 90;
            bytesEl.textContent = mb(loaded) + " of " + mb(total);
        } else {
            pct = unityProgress * 100;
            bytesEl.textContent = loaded ? mb(loaded) + " downloaded" : "Loading…";
        }

        shown = Math.max(shown, Math.min(pct, 100));
        fill.style.width = shown + "%";
        pctEl.textContent = Math.floor(shown) + "%";
        bar.setAttribute("aria-valuenow", Math.floor(shown));
    }

    let lastUnity = 0;
    const ticker = setInterval(() => render(lastUnity), 250);

    function fail(err) {
        clearInterval(ticker);
        document.getElementById("loader-error-msg").textContent = String(err && err.message || err);
        loader.classList.add("failed");
    }

    let unityInstance = null;

    document.getElementById("fullscreen-btn").addEventListener("click", () => {
        if (unityInstance) unityInstance.SetFullscreen(1);
        else document.documentElement.requestFullscreen?.();
    });

    const canvas = document.getElementById("unity-canvas");
    canvas.addEventListener("pointerdown", () => canvas.focus());

    // =====================================================================
    // REENSAMBLADO DE PARTES
    // =====================================================================
    // Cambia aquí según lo que hayas partido con 7-Zip:
    //   - "data"  -> partiste "Classic Us WEB.data" (lo más probable, es el pesado)
    //   - "wasm"  -> partiste "Classic Us WEB.wasm"
    const WHICH_IS_SPLIT = "data";

    // Nombre base y número de partes (tus archivos: Classic Us WEB.001, .002, .003)
    const SPLIT_BASE = "Classic Us WEB";
    const SPLIT_PARTS = 3;

    async function reassembleParts(baseName, numParts, mimeType) {
        const buffers = [];
        for (let i = 1; i <= numParts; i++) {
            const partUrl = `Build/${baseName}.${String(i).padStart(3, "0")}`;
            const res = await fetch(partUrl);
            if (!res.ok) throw new Error(`Failed to fetch ${partUrl}: HTTP ${res.status}`);
            buffers.push(await res.arrayBuffer());
        }
        const blob = new Blob(buffers, { type: mimeType });
        return URL.createObjectURL(blob);
    }

    (async () => {
        let splitBlobUrl;
        try {
            const mime = WHICH_IS_SPLIT === "wasm"
                ? "application/wasm"
                : "application/octet-stream";
            splitBlobUrl = await reassembleParts(SPLIT_BASE, SPLIT_PARTS, mime);
        } catch (e) {
            fail(e);
            return;
        }

        const dataUrl   = WHICH_IS_SPLIT === "data" ? splitBlobUrl : "Build/Classic Us WEB.data?v=1791046953";
        const codeUrl   = WHICH_IS_SPLIT === "wasm" ? splitBlobUrl : "Build/Classic Us WEB.wasm?v=1791046931";
        const frameworkUrl = "Build/Classic Us WEB.framework.js?v=1791046914";

        const script = document.createElement("script");
        script.src = "Build/Classic Us WEB.loader.js?v=1791046914";
        script.onerror = () => fail("Couldn't load the game loader.");
        script.onload = () => {
            createUnityInstance(canvas, {
                dataUrl: dataUrl,
                frameworkUrl: frameworkUrl,
                codeUrl: codeUrl,
                symbolsUrl: "Build/Classic Us WEB.symbols.json?v=1791046921",
                streamingAssetsUrl: "StreamingAssets",
                companyName: "AUAD",
                productName: "Classic Us",
                productVersion: "2026.9.20",
                showBanner: (msg, type) => { if (type === "error") fail(msg); else console.warn(msg); },
            }, p => { lastUnity = p; render(p); })
                .then(instance => {
                    unityInstance = instance;
                    clearInterval(ticker);
                    render(1);
                    loader.classList.add("done");
                    canvas.focus();
                    window.fetch = realFetch;
                    URL.revokeObjectURL(splitBlobUrl);
                })
                .catch(fail);
        };
        document.body.appendChild(script);
    })();
</script>
</body>

</html>
