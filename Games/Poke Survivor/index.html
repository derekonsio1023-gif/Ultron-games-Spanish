<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>PokéSurvivor - Local</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background: #000;
        }
        #embed-iframe-wrapper {
            width: 100vw;
            height: 100vh;
        }
        #game-player {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body class="embed game-pokesurvivor">

    <div id="embed-iframe-wrapper">
        <iframe
            id="game-player"
            src="game/index.html?mp_locale=es_ES&mp_player_type=IFRAME"
            allowfullscreen
            allow="autoplay; fullscreen; camera; clipboard-read; clipboard-write;"
            scrolling="no"
            frameborder="0">
        </iframe>
    </div>

</body>
</html>
